name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # El script `test` usa el glob de `node --test`, soportado recien desde Node 21.
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Correr tests
        run: npm test

  # `engines` declara >=18: acá solo comprobamos que instala y compila.
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
